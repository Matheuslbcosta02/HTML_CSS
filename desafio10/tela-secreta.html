<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login secreto</title>
    <link rel="shortcut icon" href="hidden.png" type="image/x-icon">

    <style>
     
        header{
            background-color: rgba(255, 255, 255, 0.078);
            text-align: center;
            position: fixed;
            
        }

        header a{
            color: black;
            text-decoration: none;
            font-size: 20px;
            background-color: lightgray;
            font-weight: bolder;
            box-shadow: 1px 1px 8px rgba(0, 0, 0, 0.598);
        }

        body{
            overflow: hidden;
        }
        
        div.quadrado{
            border: 2px solid black;
            width: 300px;
            height: 300px;
            display: inline-block;
            border-radius: 10px;
            background-color: lightgray;
            margin: 80px;

        }

        div#q1{
            background-color: cyan;
        }
        div#q2{
            background-image: linear-gradient(to bottom, yellow, orange);
            padding-top: 100px;
            width: 400px;
            box-shadow: 1px 1px 7px rgba(0, 0, 0, 0.553);
            text-shadow:1px 1px 7px rgba(0, 0, 0, 0.612);
        }

        div#q3{
            background-image: url('imagens/pattern002.png');
        }
        main{
            background-image: url('imagens/wallpaper006.jpg');
            
        }
        div#q2 input{
            width: 200px;
            margin-left: 100px;
            margin-top: 30px;
            
        }

        div#q2 p{
            font-weight: bolder;
            font-size: 40px;
            text-align: center;
            margin-top: -40px;
            display: grid;
        }
        div#q2 p.email{
            font-size: 15px;
            margin-left: 12px;
            text-decoration: underline;
        }
        div#q2 p.senha{
            margin-top: 20px;
            font-size: 15px;
            margin-left: 12px;
            text-decoration: underline;
        }

        div#q2 p.email::after{
            content: 'login';
            
        }
        div#q2 p.senha::after{
            content: 'senha';
        }
       
        footer {
            text-align: center;
            background-color: black;
            color: white;
            font-weight: bolder;
            padding-bottom: 20px;
            width: 1600px;
            margin-left: -15px;
            padding-top: 3px;
        }
      
    </style>


</head>
<main>

    <header>
        <a href="android.html">VOLTAR</a>
    </header>
    
    <body>
    
        <div class="quadrado" id="q1">
    
        </div>
    
        <div class="quadrado" id="q2">
            <p>LOGIN</p>
                <p class="email"><input type="search"></p>
                <p class="senha"><input type="password"></p>
    
        </div>
    
        <div class="quadrado" id="q3">
    
        </div>
    
    
    </body>
    
    <footer>Feito por <em>Matheus Costa</em></footer>
</main>
</html>
