<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN - MATHEUS</title>
    <link rel="stylesheet" href="login-style.css">
    <link rel="shortcut icon" href="imgs/hidden.png" type="image/x-icon">
  

</head>
<body>
    <main class="container">

        <form action="">
            <h1>LOGIN</h1>
            <div class="input">

                <input placeholder="Usuário" type="email">
                <img class="simbolo-user" src="imgs/people.png" alt="simbolo usuario">
            </div>

            <div class="input">

                <input placeholder="Senha" type="password">
                <img class="simbolo-senha" src="imgs/password.png" alt="simbolo senha">
            </div>

            <div class="Esqueci">
                <label>
                    <input type="checkbox">
                    Lembrar senha
                
                </label>
                <a href="#">Esqueci senha</a>
            </div>

            <button type="submit">
                    Login

            </button>

            <div class="Cadastro">
                <p>Não tem conta? <a href="#">Cadastre-se</a></p>

            </div>


        </form>




    </main>
    <footer><p>Feito por Matheus Costa</p></footer> 
</body>

</html>
